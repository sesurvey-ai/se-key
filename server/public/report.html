<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SE Survey — รายงานผลงานรายผู้คีย์</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    /* Slate header — visually distinct from admin's blue + detail's slate. */
    .hdr { background: #37474f; }

    .stats-row {
      display: flex; gap: 12px;
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      flex-wrap: wrap;
    }
    .stat-card {
      flex: 1; min-width: 140px;
      padding: 10px 14px;
      background: #f6f9fd;
      border: 1px solid #d8e3f3;
      border-radius: 8px;
    }
    .stat-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 22px; font-weight: 700; color: #1a73e8; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .stat-value.muted { color: #555; }
    .stat-value.warn  { color: #e65100; }
    .stat-value.good  { color: #2e7d32; }

    .controls-row2 { padding-top: 0; }
    .date-label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #555; }
    .date-input { padding: 6px 8px; border: 1px solid #c7d0da; border-radius: 6px; font-size: 13px; font-family: inherit; }
    .spacer { flex: 1; }

    /* Numeric columns — right-aligned, tabular-nums for clean alignment. */
    .col-num { text-align: right; font-variant-numeric: tabular-nums; }
    .col-rank { width: 40px; text-align: center; color: #888; font-weight: 600; }
    th.col-num { text-align: right; }

    .chart-wrap {
      padding: 14px 20px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      margin-top: 12px;
    }
    .chart-title { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 8px; }
    .legend { display: flex; gap: 14px; margin-bottom: 10px; font-size: 12px; color: #555; }
    .legend-dot { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
    .chart-bar         { stroke: none; }
    .chart-bar-sent    { fill: #34c759; }
    .chart-bar-pending { fill: #ff9500; }
    .chart-label { font-size: 11px; fill: #444; font-family: inherit; }
    .chart-value { font-size: 11px; fill: #222; font-weight: 600; font-family: inherit; }
  </style>
</head>
<body>
  <header class="hdr">
    <h1>📊 SE Survey — รายงานผลงานรายผู้คีย์</h1>
    <div class="hdr-right">
      <span id="conn-dot" class="conn-dot" title="สถานะ server"></span>
      <button id="btn-settings" class="btn btn-icon" type="button" title="ตั้งค่า API key">⚙</button>
    </div>
  </header>

  <section class="controls">
    <label class="date-label">ตั้งแต่
      <input type="date" id="from-date" class="date-input">
    </label>
    <label class="date-label">ถึง
      <input type="date" id="to-date" class="date-input">
    </label>
    <select id="work-type" class="sel">
      <option value="">— ทุกประเภทงาน —</option>
      <option value="งานต้น">งานต้น</option>
      <option value="งานตาม">งานตาม</option>
      <option value="งานรวม">งานรวม</option>
      <option value="SESV">SESV</option>
    </select>
    <button id="btn-date-clear" class="btn btn-secondary" type="button">ล้างวันที่</button>
    <button id="btn-refresh" class="btn btn-primary" type="button">รีเฟรช</button>
    <span class="spacer"></span>
  </section>

  <section class="stats-row">
    <div class="stat-card"><div class="stat-label">จำนวนผู้คีย์</div><div class="stat-value muted" id="stat-keyers">—</div></div>
    <div class="stat-card"><div class="stat-label">รวมทั้งหมด</div><div class="stat-value"      id="stat-total">—</div></div>
    <div class="stat-card"><div class="stat-label">ส่งแล้ว</div>     <div class="stat-value good" id="stat-sent">—</div></div>
    <div class="stat-card"><div class="stat-label">รอส่ง</div>       <div class="stat-value warn" id="stat-pending">—</div></div>
  </section>

  <section class="summary"><span id="summary-text">กำลังโหลด...</span></section>

  <section class="chart-wrap" id="chart-section" hidden>
    <div class="chart-title">Top 15 ผู้คีย์ (เรียงตามจำนวนรวม)</div>
    <div class="legend">
      <span><span class="legend-dot" style="background:#34c759"></span>ส่งแล้ว</span>
      <span><span class="legend-dot" style="background:#ff9500"></span>รอส่ง</span>
    </div>
    <svg id="chart-svg" width="100%" height="0" xmlns="http://www.w3.org/2000/svg"></svg>
  </section>

  <section class="table-wrap">
    <table id="records-table">
      <thead>
        <tr>
          <th class="col-rank">#</th>
          <th>ผู้คีย์</th>
          <th class="col-num">รวม</th>
          <th class="col-num">ส่งแล้ว</th>
          <th class="col-num">รอส่ง</th>
          <th class="col-num">งานต้น</th>
          <th class="col-num">งานตาม</th>
          <th class="col-num">งานรวม</th>
          <th class="col-num">SESV</th>
          <th>คีย์ล่าสุด</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>

  <!-- API key settings modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-card">
      <h2>ตั้งค่า</h2>
      <label>API key
        <input type="text" id="f-apikey" placeholder="shared secret ตรงกับ SE_KEY_API_KEY ของ server">
      </label>
      <div class="form-actions">
        <button type="button" id="btn-settings-cancel" class="btn btn-secondary">ยกเลิก</button>
        <button type="button" id="btn-settings-save"   class="btn btn-primary">บันทึก</button>
      </div>
    </div>
  </div>

  <script src="report.js"></script>
</body>
</html>

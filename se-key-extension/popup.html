<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>SE Survey Helper settings</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      font-size: 13px;
      color: #222;
      margin: 0;
      padding: 14px;
      width: 300px;
      background: #fafafa;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    h1 .ver { color: #aaa; font-weight: 400; font-size: 11px; }
    h1 .spacer { flex: 1; }
    .conn-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #c1c7cd;
      box-shadow: 0 0 0 2px #fff, 0 0 0 3px rgba(0,0,0,0.08);
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .conn-dot.ok  { background: #34c759; }
    .conn-dot.err { background: #ff3b30; }
    label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #c7d0da;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
    }
    input:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
    }
    .row { margin-bottom: 10px; }
    .actions { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button.secondary { background: #e0e0e0; color: #333; }
    button:hover { opacity: 0.9; }
    #status {
      margin-top: 10px;
      padding: 6px 8px;
      font-size: 12px;
      border-radius: 6px;
      background: #f5f5f5;
      color: #666;
      min-height: 18px;
      word-break: break-all;
    }
    #status.ok   { background: #e8f5e9; color: #2e7d32; }
    #status.err  { background: #ffebee; color: #c62828; }
    #status.busy { background: #e3f2fd; color: #1565c0; }
    .hint { font-size: 11px; color: #888; margin-top: 2px; }
  </style>
</head>
<body>
  <h1>
    <span>SE Survey Helper — ตั้งค่า</span>
    <span id="ver" class="ver">v?</span>
    <span class="spacer"></span>
    <span id="popup-conn-dot" class="conn-dot" title="สถานะ server"></span>
  </h1>
  <div class="row">
    <label for="serverUrl">Server URL</label>
    <input id="serverUrl" type="url" placeholder="https://key.sesurvey.cloud">
    <div class="hint">เช่น https://key.sesurvey.cloud (ไม่ต้องมี / ปิดท้าย)</div>
  </div>
  <div class="row">
    <label for="apiKey">API key</label>
    <input id="apiKey" type="text" placeholder="shared secret (ถามแอดมินเซิร์ฟเวอร์)">
    <div class="hint">ตรงกับ SE_KEY_API_KEY ใน .env ฝั่ง server (ถ้า server ไม่ได้ตั้ง ให้เว้นว่าง)</div>
  </div>
  <div class="actions">
    <button id="test" class="secondary" type="button">ทดสอบ</button>
    <button id="save" type="button">บันทึก</button>
  </div>
  <div class="actions" style="margin-top: 8px;">
    <button id="records" class="secondary" type="button">📋 ดูรายงาน</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
